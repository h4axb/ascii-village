/* ========== 1. DESIGN TOKENS ========== */
:root {
  --game-font: 'Asciia Mono', ui-monospace, Menlo, Consolas, monospace;
  /* base palette: cream, butter yellow, apple red, maroon text, leaf green */
  --ui-heading: #6b2a1f;                       /* text */
  --ui-body: #8a5a46;
  --ui-muted: #b58f74;
  --ui-accent: #d9473f;                        /* apple red */
  /* design system */
  --ds-text: var(--ui-heading);
  --ds-text-soft: var(--ui-body);
  --ds-text-muted: var(--ui-muted);
  --ds-line: #f1d891;                          /* soft yellow lines */
  --ds-line-soft: #f6e7bd;
  --ds-line-strong: #eec65a;                   /* butter yellow: bubbles, frames */
  --ds-sheet: transparent;                     /* outside the box: transparent */
  --ds-surface: #fff8e8;                       /* icon buttons */
  --ds-surface-hi: #fdeec8;
  --ds-panel: #fffbf1;                         /* the panel itself */
  --ds-bubble: #fff6e2;                        /* chat bubbles */
  --ds-dialogue: #fff6e2;                      /* portraits, options */
  --ds-field: #fff3d4;                         /* the prompt field, the art frame */
  --ds-tab: #f7dc8c;                           /* the history bookmark */
  --ds-blur: none;
  --ds-select: #d9473f;                        /* the option arrow */
  --ds-go: #7fb446;                            /* Craft it! when active */
  --ds-go-fill: #8cc152;
  --ds-go-ink: #ffffff;
  --ds-name: #d9473f;                          /* names */
  --ds-idle: #e0b35a;                          /* Craft it! when idle */
  --ds-coin: #d9473f;
  --ds-pill: #fde7a6;                          /* the coin pill's fill */
  --ds-radius: 10px;
  --ds-radius-sm: 7px;
  --ds-font-size: 14px;
  --accent: var(--ui-accent);                  /* the progress bar */
}

/* ========== 2. PANEL STYLES (as in the game) ========== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--game-font); font-variant-ligatures: none; color: var(--ds-text); overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 1px solid #555; cursor: pointer; }
pre { font-family: inherit; }

.ds-sheet { position: relative; width: min(1180px, 96vw); margin: 0 auto; padding: 22px 40px 26px; display: flex; justify-content: center; align-items: flex-start; height: 100dvh; background: var(--ds-sheet); backdrop-filter: var(--ds-blur); color: var(--ds-text); font-size: var(--ds-font-size); }
.ds-sheet button { font: inherit; color: inherit; }
.ds-sheet-inner { display: flex; flex-direction: column; max-width: 100%; height: 100%; }
.ds-sheet-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px; }
.ds-sheet-corner { display: flex; align-items: center; gap: 10px; }
/* the panel's header: back, the title, coins and close inside the box */
.cw3-head { display: flex; align-items: center; gap: 14px; margin: -4px 0 14px; padding-bottom: 14px; border-bottom: 1px solid var(--ds-line-soft); }
.cw3-head .ds-sheet-corner { margin-left: auto; }
.cw3-head-title { font-size: 15px; font-weight: 600; color: var(--ds-text); }
.cw3-head .ds-iconbtn { width: 40px; height: 40px; }
.cw3-head .ds-iconbtn:not(.is-round) { border-radius: 999px; }
.ds-sheet-body { flex: 1 1 0%; display: flex; flex-direction: column; min-height: 0; }
.ds-iconbtn { display: grid; place-items: center; width: 46px; height: 42px; padding: 0; border: 1px solid var(--ds-line); border-radius: var(--ds-radius-sm); background: var(--ds-surface); color: var(--ds-text); cursor: pointer; }
.ds-iconbtn:hover { border-color: var(--ds-line-strong); background: var(--ds-surface-hi); }
.ds-currency { display: flex; align-items: center; gap: 10px; padding: 7px 20px 7px 9px; border: 0; border-radius: 999px; background: var(--ds-pill); font-size: 17px; letter-spacing: 0.5px; font-variant-numeric: tabular-nums; }
.ds-currency .ds-coin-icon { width: 22px; height: 22px; }
.ds-currency span { color: var(--ds-text); font-weight: 600; }
/* the close button: a circle */
.ds-iconbtn.is-round { width: 44px; height: 44px; border-radius: 50%; }
.ds-currency.spent span { color: var(--ds-coin) !important; }
.ds-coin-icon { flex: 0 0 auto; vertical-align: -3px; }

.ds-frame { position: relative; border: 1px solid var(--ds-line-strong); border-radius: var(--ds-radius-sm); }
.ds-bracket { position: absolute; width: 10px; height: 10px; border: 0 dashed var(--ds-line); pointer-events: none; }
.ds-bracket.tl { left: 5px; top: 5px; border-left-width: 2px; border-top-width: 2px; border-top-left-radius: 4px; }
.ds-bracket.tr { right: 5px; top: 5px; border-right-width: 2px; border-top-width: 2px; border-top-right-radius: 4px; }
.ds-bracket.bl { left: 5px; bottom: 5px; border-left-width: 2px; border-bottom-width: 2px; border-bottom-left-radius: 4px; }
.ds-bracket.br { right: 5px; bottom: 5px; border-right-width: 2px; border-bottom-width: 2px; border-bottom-right-radius: 4px; }

.cw3 { width: min(1100px, 86vw); flex: 1 1 0%; display: flex; flex-direction: column; min-height: 0; padding: 24px 28px 20px; border-radius: 22px; border-width: 2px; background: var(--ds-panel); box-shadow: 0 10px 30px rgba(170, 120, 40, 0.12); }
.cw3 > .ds-bracket { width: 16px; height: 16px; }
.cw3 > .ds-bracket.tl { left: 9px; top: 9px; }
.cw3 > .ds-bracket.tr { right: 9px; top: 9px; }
.cw3 > .ds-bracket.bl { left: 9px; bottom: 9px; }
.cw3 > .ds-bracket.br { right: 9px; bottom: 9px; }
.cw3-bookmark { position: absolute; top: 10px; right: -39px; display: grid; place-items: center; width: 38px; height: 58px; padding: 0 0 8px; border: 0; border-radius: 0 var(--ds-radius-sm) var(--ds-radius-sm) 0; background: var(--ds-tab); color: var(--ds-text); cursor: pointer; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 86%, 0 100%); }
.cw3-bookmark:hover, .cw3-bookmark.open { background: var(--ds-line-strong); color: var(--ds-text); }
.cw3-body { position: relative; display: flex; gap: 20px; flex: 1 1 0%; min-height: 240px; }
.cw3-chat { flex: 1 1 0%; min-width: 0; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; padding: 4px 8px 4px 4px; scrollbar-width: thin; scrollbar-color: var(--ds-line-strong) transparent; }
.cw3-history { flex: 0 0 240px; display: none; flex-direction: column; gap: 8px; padding-left: 20px; border-left: 1px solid var(--ds-line-soft); overflow-y: auto; }
.cw3-history.open { display: flex; }
.cw3-history h3 { font-size: 13px; font-weight: 500; color: var(--ds-text-soft); margin-bottom: 4px; }
.cw3-history button { text-align: left; padding: 9px 12px; border: 1px solid var(--ds-line); border-radius: var(--ds-radius-sm); background: var(--ds-dialogue); }
.cw3-history button small { display: block; color: var(--ds-text-muted); font-size: 11px; margin-top: 2px; }
.cw3-bottom { display: flex; gap: 16px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--ds-line-soft); }
.cw3-prompt { flex: 1 1 0%; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 0 20px; background: var(--ds-field); border-color: var(--ds-line); }
.cw3-input { flex: 1 1 0%; min-width: 0; padding: 18px 0; border: none; outline: none; background: none; color: var(--ds-text); font: inherit; font-size: 15px; }
.cw3-input::placeholder { color: var(--ds-text-muted); }
.cw3-input:disabled { cursor: default; }
.cw3-count { flex: 0 0 auto; color: var(--ds-text-muted); font-size: 12px; }
.cw3-craft { flex: 0 0 auto; display: flex; align-items: center; gap: 16px; padding: 0 34px; border: 1px solid var(--ds-idle); border-radius: 999px; background: var(--ds-surface); cursor: pointer; color: var(--ds-idle) !important; font-size: 17px !important; }
.cw3-craft:not(:disabled) { border-color: var(--ds-go); background: var(--ds-go-fill); color: var(--ds-go-ink) !important; }
.cw3-craft:hover:not(:disabled) { background: var(--ds-go); }
.cw3-craft:disabled { opacity: 0.45; cursor: default; }

.ds-msg { display: flex; align-items: flex-start; gap: 18px; animation: msg-in 0.18s ease; }
.ds-msg.right { flex-direction: row-reverse; }
.ds-portrait { flex: 0 0 auto; width: 84px; display: flex; flex-direction: column; align-items: center; gap: 7px; }
.ds-portrait-box { width: 76px; height: 76px; border: 1px solid var(--ds-line); border-radius: var(--ds-radius-sm); background: var(--ds-dialogue); overflow: hidden; }
.ds-portrait-box img { width: 100%; height: 100%; display: block; image-rendering: auto; }
.ds-portrait-name { color: var(--ds-name); font-size: 14px; font-weight: 600; letter-spacing: 0.5px; text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ds-msg-bubbles { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; min-width: 0; max-width: min(480px, 64%); }
.ds-msg.right .ds-msg-bubbles { align-items: flex-end; }
.ds-bubble { position: relative; max-width: 100%; padding: 12px 20px; border: 1px solid var(--ds-line-strong); border-radius: var(--ds-radius-sm); background: var(--ds-bubble); line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
/* the speech-bubble shape: soft round corners and a curled tail at the top on
   the speaker's side (an inline SVG, see TAIL in the script) */
.ds-msg .ds-bubble { --bub-line: 2px; border-width: var(--bub-line); border-radius: 18px; }
.ds-tail { position: absolute; left: -17px; top: 10px; width: 17px; height: 22px; overflow: visible; pointer-events: none; }
.ds-tail .fill { fill: var(--ds-bubble); }
.ds-tail .line { fill: none; stroke: var(--ds-line-strong); stroke-width: var(--bub-line); stroke-linecap: round; stroke-linejoin: round; }
.ds-msg.right .ds-tail { left: auto; right: -17px; transform: scaleX(-1); }
/* Mitchy's portrait: a circle (dark: he is a black cat) */
.ds-msg.left .ds-portrait-box { border-radius: 50%; background: #1d1a17; border-color: var(--ds-line-strong); }
.ds-muted { color: var(--ds-text-muted); }

.cw3-card { display: flex; flex-direction: column; gap: 6px; white-space: normal; }
.cw3-art { width: 300px; max-width: 100%; height: 170px; background: var(--ds-field); border-color: var(--ds-line); display: grid; place-items: center; overflow: hidden; }
.cw3-art pre { font-size: 12px; line-height: 1; white-space: pre; }
.cw3-card-name { margin-top: 4px; color: var(--ds-text); font-size: 16px; }
.cw-ellipsis::after { content: "..."; animation: cw-blink 1.1s steps(4) infinite; }
@keyframes cw-blink { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
.cw-progress-bar { margin-top: 6px; height: 3px; background: var(--ds-line-soft); border-radius: 2px; overflow: hidden; }
.cw-progress-bar span { display: block; height: 100%; width: 40%; background: var(--accent); animation: cw-slide 1.3s ease-in-out infinite; }
@keyframes cw-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
@keyframes msg-in { 0% { opacity: 0; transform: translateY(6px); } }

.ds-options { display: flex; flex-direction: column; gap: 8px; }
.cw3-replies { align-self: flex-end; width: min(360px, 60%); margin-right: 102px; }
.ds-option { position: relative; padding: 11px 30px; border: 1px solid var(--ds-line); border-radius: 999px; background: var(--ds-bubble); color: var(--ds-text); font: inherit; text-align: left; cursor: pointer; }
.ds-option:disabled { opacity: 0.4; cursor: default; }
.ds-option.sel { border-color: var(--ds-line-strong); box-shadow: 0 0 0 1px var(--ds-line-strong) inset; background: #fff0c9; }
.ds-option.sel::before { content: ""; position: absolute; left: -20px; top: 50%; transform: translateY(-50%); border-left: 11px solid var(--ds-select); border-top: 8px solid transparent; border-bottom: 8px solid transparent; }

/* sprite colours (the built-in example results) */
.c-wood { color: #b0763a; } .c-dark { color: #6b4320; } .c-sail { color: #d9534f; } .c-sail2 { color: #f08a7e; }
.c-water { color: #4f8fb8; } .c-foam { color: #cfe6f2; } .c-rope { color: #e9dcc1; } .c-gold { color: #f2b53c; }
.c-straw { color: #e2c46b; } .c-band { color: #c97367; } .c-glass { color: #bfe3ef; } .c-flame { color: #ffb347; } .c-metal { color: #9aa5ab; }

@media (max-width: 820px) {
  .ds-sheet { padding: 16px 12px 16px; }
  .cw3-head-title { display: none; }
  .cw3-bookmark { position: static; width: 40px; height: 40px; padding: 0; border: 1px solid var(--ds-line); border-radius: 50%; clip-path: none; background: var(--ds-surface); }
  .cw3-craft span { display: none; }
  .cw3-craft { padding: 0 18px; }
  .cw3 { width: 92vw; padding: 18px 14px 14px; }
  .ds-portrait { width: 60px; }
  .ds-portrait-box { width: 56px; height: 56px; }
  .ds-msg-bubbles { max-width: 78%; }
  .cw3-craft { padding: 0 16px; }
  .cw3-replies { margin-right: 0; width: 80%; }
  .cw3-history { position: absolute; inset: 0 0 0 auto; width: 70%; background: var(--ds-panel); padding: 12px; }
}

/* ========== the try-out bar (not part of the panel) ========== */
body.stage-checker { background: repeating-conic-gradient(#d8d8d8 0% 25%, #f2f2f2 0% 50%) 0 0 / 22px 22px; }
body.stage-game { background: radial-gradient(circle at 30% 40%, #6f8a52, #3c4d2c 60%, #23301b); }
body.stage-dark { background: #0a0a0a; }
body.stage-cream { background: #fdf3dc; }
body.stage-none { background: transparent; }
body.stage-checker .ds-sheet, body.stage-none .ds-sheet, body.stage-cream .ds-sheet { background: transparent; backdrop-filter: none; }
.dev-bar { position: fixed; z-index: 50; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; border-radius: 10px; background: rgba(15, 15, 15, 0.82); color: #ddd; font: 12px/1.2 system-ui, sans-serif; max-width: calc(100vw - 16px); }
.dev-bar button, .dev-bar select { font: inherit; padding: 4px 9px; border: 1px solid #555; border-radius: 6px; background: #222; color: #ddd; }
.dev-bar button:hover { background: #333; }
.dev-bar .dev-hide { margin-left: 4px; }
.dev-bar.min > :not(.dev-show) { display: none; }
.dev-bar .dev-show { display: none; }
.dev-bar.min .dev-show { display: inline-block; }
body:has(.dev-bar:not(.min)) .ds-sheet { padding-top: 70px; }
.dev-toast { position: fixed; z-index: 51; left: 50%; bottom: 18px; transform: translateX(-50%); padding: 8px 14px; border-radius: 8px; background: rgba(15, 15, 15, 0.88); color: #eee; font: 13px system-ui, sans-serif; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.dev-toast.on { opacity: 1; }
</style>

  const el = document.createElement('div');
  el.className = `ds-msg ${side}`;
  el.innerHTML = `<div class="ds-portrait"><div class="ds-portrait-box"><img alt="" src="${PORTRAIT[name]}"></div><div class="ds-portrait-name">${name}</div></div><div class="ds-msg-bubbles">${bubbles.map((b, i) => `<div class="ds-bubble">${i === 0 ? TAIL : ''}${b}</div>`).join('')}</div>`;
  chat.append(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}
function setInput(enabled, placeholder) {
  input.disabled = !enabled;
  input.placeholder = placeholder;
  if (enabled) input.focus();
  update();
}
function update() {
  count.textContent = `${input.value.length}/80`;
  craft.disabled = input.disabled || !input.value.trim() || phase === 'working';
}
function pickSprite(prompt) {
  return SPRITES.find((s) => s.key.test(prompt)) ?? FALLBACK;
}
function setCoins(n) {
  coins = n;
  const c = $('coins');
  c.querySelector('span').textContent = coins;
  c.classList.add('spent');
  setTimeout(() => c.classList.remove('spent'), 600);
}

function submit() {
  const prompt = input.value.trim();
  if (!prompt || craft.disabled) return;
  const adjusting = phase === 'adjusting';
  msg('right', 'Villager', [esc(prompt)]);
  input.value = '';
  phase = 'working';
  setInput(false, TEXT.placeholderPick);
  clearOptions();
  const sprite = adjusting ? current.sprite : pickSprite(prompt);
  // the working bubble: the drawing appears line by line
  const el = msg('left', 'Mitchy', [`<div class="cw3-card"><div class="ds-frame cw3-art"><span class="ds-bracket tl"></span><span class="ds-bracket tr"></span><span class="ds-bracket bl"></span><span class="ds-bracket br"></span><pre></pre></div><div class="ds-muted"><span class="cw-status">${TEXT.thinking}</span><span class="cw-ellipsis"></span></div><div class="cw-progress-bar"><span></span></div></div>`]);
  const pre = el.querySelector('pre'), status = el.querySelector('.cw-status');
  const step = 260;
  sprite.art.forEach((line, i) =>
    later(() => {
      pre.innerHTML += (i ? '\n' : '') + artLine(line);
      status.textContent = TEXT.drawing(i + 1);
    }, 1400 + i * step),
  );
  later(() => {
    el.remove();
    current = { sprite, prompt };
    history.unshift({ name: sprite.name, prompt });
    renderHistory();
    msg('left', 'Mitchy', [
      `<div class="cw3-card"><div class="ds-frame cw3-art"><span class="ds-bracket tl"></span><span class="ds-bracket tr"></span><span class="ds-bracket bl"></span><span class="ds-bracket br"></span><pre>${sprite.art.map(artLine).join('\n')}</pre></div><div class="cw3-card-name">${esc(sprite.name)}</div><div class="ds-muted">“${esc(sprite.punch)}”</div></div>`,
      esc(TEXT.result(sprite.name)),
    ]);
    phase = 'success';
    showOptions([
      { label: TEXT.options.equip, go: () => finish(TEXT.equipped(sprite.name)) },
      { label: TEXT.options.store, go: () => finish(TEXT.stored(sprite.name)) },
      { label: TEXT.options.adjust, go: adjust, disabled: coins < ADJUST_PRICE },
    ]);
  }, 1400 + sprite.art.length * step + 500);
}

function showOptions(list) {
  options = list;
  sel = list.findIndex((o) => !o.disabled);
  const box = document.createElement('div');
  box.className = 'ds-options cw3-replies';
  box.id = 'options';
  box.setAttribute('role', 'listbox');
  list.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'ds-option';
    b.setAttribute('role', 'option');
    b.textContent = o.label;
    b.disabled = !!o.disabled;
    b.onmouseenter = () => !o.disabled && (sel = i, markSel());
    b.onclick = () => choose(i);
    box.append(b);
  });
  chat.append(box);
  markSel();
  chat.scrollTop = chat.scrollHeight;
}
function markSel() {
  document.querySelectorAll('#options .ds-option').forEach((b, i) => {
    b.classList.toggle('sel', i === sel);
    b.setAttribute('aria-selected', String(i === sel));
  });
}
function clearOptions() {
  $('options')?.remove();
  options = [];
}
function choose(i) {
  const o = options[i];
  if (!o || o.disabled) return;
  msg('right', 'Villager', [esc(o.label)]);
  clearOptions();
  o.go();
}
function adjust() {
  if (coins < ADJUST_PRICE) return msg('left', 'Mitchy', [esc(TEXT.adjustPoor)]);
  setCoins(coins - ADJUST_PRICE);
  msg('left', 'Mitchy', [esc(TEXT.adjustAsk)]);
  phase = 'adjusting';
  setInput(true, TEXT.placeholderAdjust);
}
function finish(line) {
  msg('left', 'Mitchy', [esc(line)]);
  phase = 'done';
  setInput(false, TEXT.placeholderDone);
}
function renderHistory() {
  const h = $('history');
  h.innerHTML = '<h3>Past crafts</h3>' + history.map((x) => `<button type="button">${esc(x.name)}<small>“${esc(x.prompt)}”</small></button>`).join('');
}

function reset() {
  timers.forEach(clearTimeout);
  timers = [];
  chat.innerHTML = '';
  clearOptions();
  phase = 'input';
  current = null;
  coins = 120;
  $('coins').querySelector('span').textContent = coins;
  msg('left', 'Mitchy', [esc(TEXT.welcome)]);
  input.value = '';
  setInput(true, TEXT.placeholder);
}
function typeExample() {
  reset();
  let i = 0;
  const tick = () => {
    input.value = EXAMPLE_PROMPT.slice(0, ++i);
    update();
    if (i < EXAMPLE_PROMPT.length) later(tick, 35);
    else later(submit, 700);
  };
  later(tick, 400);
}
function toast(t) {
  const el = $('toast');
  el.textContent = t;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 1600);
}

input.addEventListener('input', update);
input.addEventListener('keydown', (e) => e.key === 'Enter' && submit());
craft.addEventListener('click', submit);
document.addEventListener('keydown', (e) => {
  if (!options.length || document.activeElement === input) return;
  const step = (d) => {
    let n = sel;
    do n = (n + d + options.length) % options.length;
    while (options[n].disabled && n !== sel);
    sel = n;
    markSel();
  };
  if (e.key === 'ArrowDown') (e.preventDefault(), step(1));
  if (e.key === 'ArrowUp') (e.preventDefault(), step(-1));
  if (e.key === 'Enter' || e.key.toLowerCase() === 'f') (e.preventDefault(), choose(sel));
});
$('bookmark').addEventListener('click', () => {
  const h = $('history'), on = !h.classList.contains('open');
  h.classList.toggle('open', on);
  $('bookmark').classList.toggle('open', on);
  $('bookmark').setAttribute('aria-expanded', String(on));
});
document.querySelector('[data-act="back"]').onclick = () => toast('← zurück (im Spiel: fragt vor dem Verlassen)');
document.querySelector('[data-act="close"]').onclick = () => toast('✕ schließen (im Spiel: fragt vor dem Verlassen)');
$('dev').addEventListener('click', (e) => {
  const a = e.target.closest('[data-dev]')?.dataset.dev;
  if (a === 'example') typeExample();
  if (a === 'reset') reset();
  if (a === 'hide') $('dev').classList.add('min');
  if (a === 'show') $('dev').classList.remove('min');
});
$('dev').addEventListener('change', (e) => {
  const a = e.target.dataset.dev;
  if (a === 'stage') document.body.className = `stage-${e.target.value}`;
  if (a === 'speed') speed = Number(e.target.value);
});
// (on a phone the bar starts folded: it would cover the panel's top)
if (innerWidth < 700) $('dev').classList.add('min');
reset();
</script>
</body>
</html>
