<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- a coin in the flat style of the fruit icons: soft left-to-right gradients,
       round shapes, no outlines. Motif: the pixel flower (pink petals around a
       yellow centre), cell by cell as in the pixel version -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f29a00"/>
      <stop offset="1" stop-color="#ffc21a"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc21a"/>
      <stop offset="1" stop-color="#ffdd55"/>
    </linearGradient>
    <linearGradient id="medal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff0c7"/>
      <stop offset="1" stop-color="#fff8e3"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6f9f"/>
      <stop offset="1" stop-color="#ffa3c0"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb300"/>
      <stop offset="1" stop-color="#ffd23f"/>
    </linearGradient>
  </defs>
  <!-- edge, face, medallion, a soft shine -->
  <circle cx="256" cy="256" r="224" fill="url(#rim)"/>
  <circle cx="256" cy="256" r="186" fill="url(#face)"/>
  <circle cx="256" cy="256" r="150" fill="url(#medal)"/>
  <path d="M106 178 A170 170 0 0 1 196 92" fill="none" stroke="#fff3c4" stroke-width="16" stroke-linecap="round" opacity="0.85"/>
  <!-- the flower, cell by cell as in the pixel version: one petal above and below, two on each side, a yellow centre -->
  <g transform="translate(256 256)">
    <rect x="-26.0" y="-83.0" width="52" height="52" rx="15" fill="url(#petal)"/>
    <rect x="-26.0" y="31.0" width="52" height="52" rx="15" fill="url(#petal)"/>
    <rect x="-140.0" y="-26.0" width="52" height="52" rx="15" fill="url(#petal)"/>
    <rect x="-83.0" y="-26.0" width="52" height="52" rx="15" fill="url(#petal)"/>
    <rect x="31.0" y="-26.0" width="52" height="52" rx="15" fill="url(#petal)"/>
    <rect x="88.0" y="-26.0" width="52" height="52" rx="15" fill="url(#petal)"/>
    <rect x="-26.0" y="-26.0" width="52" height="52" rx="15" fill="url(#heart)"/>
  </g>
</svg>
