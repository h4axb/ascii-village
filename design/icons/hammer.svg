<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="headGrad" x1="116" y1="150" x2="390" y2="150" gradientUnits="userSpaceOnUse">
